<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading...</title>
  <style>
    :root { --accent: #b3121b; --text: #e8e8e8; --muted: #8a8a8a; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    /* random full-screen background */
    #bg {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: #000 center / cover no-repeat;
    }
    #bg::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.25) 40%, rgba(0,0,0,0.7));
    }

    /* main image, centered on top */
    #main {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #main img {
      max-width: 70vw;
      max-height: 60vh;
      opacity: 0.9;
    }

    /* top-left server info */
    #info {
      position: fixed;
      top: 4vh;
      left: 4vw;
      border-left: 4px solid var(--accent);
      padding-left: 16px;
    }
    #servername {
      font-size: 3.2vw;
      font-size: clamp(22px, 3.2vw, 44px);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #meta {
      margin-top: 6px;
      font-size: 1.3vw;
      font-size: clamp(12px, 1.3vw, 18px);
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #meta b { color: var(--accent); font-weight: 600; }

    /* bottom status + progress */
    #bottom {
      position: fixed;
      left: 4vw;
      right: 4vw;
      bottom: 4vh;
    }
    #status {
      font-size: 1.2vw;
      font-size: clamp(12px, 1.2vw, 16px);
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    #bar {
      height: 4px;
      background: #1c1c1c;
    }
    #fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      transition: width 0.3s ease;
    }

    /* rare corner image (1/100) */
    #rlove {
      display: none;
      position: fixed;
      top: 2vh;
      right: 2vw;
      max-width: 8vw;
      max-height: 14vh;
    }

    /* logo, top right (hidden when the rare rlove image takes the spot) */
    #logo {
      display: none;
      position: fixed;
      top: 2vh;
      right: 2vw;
      max-width: 24vw;
      max-height: 26vh;
    }

    /* quote of the day */
    #qotd {
      margin-bottom: 18px;
      max-width: 60vw;
    }
    #qotd-label {
      font-size: 1vw;
      font-size: clamp(10px, 1vw, 13px);
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    #qotd-text {
      font-size: 1.7vw;
      font-size: clamp(14px, 1.7vw, 24px);
      font-style: italic;
      line-height: 1.4;
    }
    #qotd-author {
      margin-top: 4px;
      font-size: 1.1vw;
      font-size: clamp(11px, 1.1vw, 15px);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="main"><img id="mainimg" alt=""></div>

  <div id="info">
    <div id="servername">Zombie Survival</div>
    <div id="meta"><b>Map</b> <span id="map">—</span> &nbsp;·&nbsp; <b>Gamemode</b> <span id="gm">—</span></div>
  </div>

  <img id="rlove" alt="">
  <img id="logo" alt="">

  <div id="bottom">
    <div id="qotd">
      <div id="qotd-label">Quote of the day</div>
      <div id="qotd-text"></div>
      <div id="qotd-author"></div>
    </div>
    <div id="status">Connecting...</div>
    <div id="bar"><div id="fill"></div></div>
  </div>

  <script>
    // Add #debug to the page URL to see which images loaded and which are missing
    var debug = location.hash.indexOf("debug") !== -1, panel = null;
    function log(msg) {
      if (window.console) console.log(msg);
      if (!debug) return;
      if (!panel) {
        panel = document.createElement("div");
        panel.style.cssText = "position:fixed;left:8px;top:40vh;z-index:9;padding:6px 10px;background:rgba(0,0,0,.85);color:#0f0;font:12px monospace;max-width:80vw;";
        document.body.appendChild(panel);
      }
      var d = document.createElement("div");
      d.textContent = msg;
      panel.appendChild(d);
    }

    // Finds a working file for an image path. Tries the path as written first, then
    // other common extensions (GitHub Pages is case-sensitive: .JPG is not .jpg).
    var exts = ["jpg", "jpeg", "png", "webp", "gif", "JPG", "JPEG", "PNG"];
    function resolveImage(path, cb) {
      var base = path.slice(0, path.lastIndexOf("."));
      var list = [path];
      for (var k = 0; k < exts.length; k++) {
        var c = base + "." + exts[k];
        if (list.indexOf(c) < 0) list.push(c);
      }
      var n = 0;
      (function next() {
        if (n >= list.length) { log("MISSING: " + path); cb(null); return; }
        var p = list[n++], im = new Image();
        im.onload = function () {
          log(p === path ? "ok: " + p + " (" + im.naturalWidth + "x" + im.naturalHeight + ")" : path + " not found, using " + p);
          cb(p);
        };
        im.onerror = next;
        im.src = p;
      })();
    }

    // Random background: list the files you put in the bg folder here.
    // If one is missing or broken, another is tried.
    var backgrounds = [
      "bg/1.jpg",
      "bg/2.jpg",
      "bg/3.jpg",
      "bg/4.jpg"
    ];
    (function pickBg(list) {
      if (!list.length) return;
      var i = Math.floor(Math.random() * list.length);
      resolveImage(list[i], function (p) {
        if (p) document.getElementById("bg").style.backgroundImage = "url('" + p + "')";
        else { list.splice(i, 1); pickBg(list); }
      });
    })(backgrounds.slice());

    // Main centered image
    resolveImage("image.png", function (p) {
      if (p) document.getElementById("mainimg").src = p;
    });

    // Quote of the day: add your own quotes here (changes once per day)
    var quotes = [
      { text: "Vibecode :steamhappy:", author: "Coolin" },
      { text: "Ralsei_love.", author: "Coolin" },
      { text: "I improvise a little.", author: "Red" }
    ];
    if (quotes.length) {
      var day = Math.floor(Date.now() / 86400000);
      var q = quotes[day % quotes.length];
      document.getElementById("qotd-text").textContent = "\u201C" + q.text + "\u201D";
      document.getElementById("qotd-author").textContent = q.author ? "\u2014 " + q.author : "";
    } else {
      document.getElementById("qotd").style.display = "none";
    }

    // Top right corner: 1/100 chance of rlove.png (add #rlove to the URL to force it), otherwise logo.png
    var showRare = Math.floor(Math.random() * 100) === 0 || location.hash.indexOf("rlove") !== -1;
    var corner = document.getElementById(showRare ? "rlove" : "logo");
    resolveImage(showRare ? "rlove.png" : "logo.png", function (p) {
      if (p) { corner.src = p; corner.style.display = "block"; }
    });

    // Garry's Mod loading screen callbacks
    var total = 0, needed = 0;

    function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
      if (servername) document.getElementById("servername").textContent = servername;
      if (mapname) document.getElementById("map").textContent = mapname;
      if (gamemode) document.getElementById("gm").textContent = gamemode;
    }
    function SetFilesTotal(t) { total = t; updateBar(); }
    function SetFilesNeeded(n) { needed = n; updateBar(); }
    function SetStatusChanged(s) { document.getElementById("status").textContent = s; }

    function updateBar() {
      if (total > 0) {
        var pct = Math.max(0, Math.min(100, ((total - needed) / total) * 100));
        document.getElementById("fill").style.width = pct + "%";
      }
    }
  </script>
</body>
</html>
