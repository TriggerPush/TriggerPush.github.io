<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading...</title>
  <style>
    :root { --accent: #b3121b; --text: #e8e8e8; --muted: #8a8a8a; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    /* main image, centered on black */
    #main {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #main img {
      max-width: 70vw;
      max-height: 60vh;
      opacity: 0.9;
    }

    /* top-left server info */
    #info {
      position: fixed;
      top: 4vh;
      left: 4vw;
      border-left: 4px solid var(--accent);
      padding-left: 16px;
    }
    #servername {
      font-size: clamp(22px, 3.2vw, 44px);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #meta {
      margin-top: 6px;
      font-size: clamp(12px, 1.3vw, 18px);
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #meta b { color: var(--accent); font-weight: 600; }

    /* bottom status + progress */
    #bottom {
      position: fixed;
      left: 4vw;
      right: 4vw;
      bottom: 4vh;
    }
    #status {
      font-size: clamp(12px, 1.2vw, 16px);
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    #bar {
      height: 4px;
      background: #1c1c1c;
    }
    #fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      transition: width 0.3s ease;
    }

    /* rare corner image (1/100) */
    #rlove {
      display: none;
      position: fixed;
      right: 2vw;
      bottom: 12vh;
      max-width: 20vw;
      max-height: 30vh;
    }
  </style>
</head>
<body>
  <div id="main"><img src="image.png" alt=""></div>

  <div id="info">
    <div id="servername">Zombie Survival</div>
    <div id="meta"><b>Map</b> <span id="map">—</span> &nbsp;·&nbsp; <b>Gamemode</b> <span id="gm">—</span></div>
  </div>

  <img id="rlove" src="rlove.png" alt="">

  <div id="bottom">
    <div id="status">Connecting...</div>
    <div id="bar"><div id="fill"></div></div>
  </div>

  <script>
    // 1/100 chance to show rlove.png in the corner (add #rlove to the URL to force it for testing)
    if (Math.floor(Math.random() * 100) === 0 || location.hash === "#rlove") {
      document.getElementById("rlove").style.display = "block";
    }

    // Garry's Mod loading screen callbacks
    var total = 0, needed = 0;

    function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
      if (servername) document.getElementById("servername").textContent = servername;
      if (mapname) document.getElementById("map").textContent = mapname;
      if (gamemode) document.getElementById("gm").textContent = gamemode;
    }
    function SetFilesTotal(t) { total = t; updateBar(); }
    function SetFilesNeeded(n) { needed = n; updateBar(); }
    function SetStatusChanged(s) { document.getElementById("status").textContent = s; }

    function updateBar() {
      if (total > 0) {
        var pct = Math.max(0, Math.min(100, ((total - needed) / total) * 100));
        document.getElementById("fill").style.width = pct + "%";
      }
    }
  </script>
</body>
</html>
