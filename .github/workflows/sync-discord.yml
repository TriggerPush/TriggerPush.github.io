name: Sync Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "art/**"

permissions:
  contents: write

concurrency:
  group: discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull Discord messages and build art manifest
        run: node scripts/sync-discord.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.BOT_ID }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data art/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Discord content"
            git pull --rebase
            git push
          fi
